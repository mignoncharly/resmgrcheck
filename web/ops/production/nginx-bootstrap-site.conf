server {
    listen 80;
    listen [::]:80;
    server_name qnx-resmgrcheck.gestionatech.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/resmgrcheck-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 404;
    }

    access_log off;
    error_log /var/log/nginx/resmgrcheck-error.log warn;
}
