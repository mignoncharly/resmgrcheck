# ResMgrCheck-specific HTTP settings.
# Do not log URLs, query strings, access codes or cookies.

log_format resmgrcheck_safe
    '$time_iso8601 $remote_addr $request_method $status';

# Rate limiting for administrator login and access-code redemption.
limit_req_zone $binary_remote_addr
    zone=resmgrcheck_auth:10m
    rate=10r/m;
