{% if app_nav.crumbs %}<div class="navigation-context"><nav aria-label="Breadcrumb"><ol>{% for crumb in app_nav.crumbs %}<li>{% if crumb.url %}<a href="{{ crumb.url }}">{{ crumb.label }}</a>{% else %}<span{% if forloop.last %} aria-current="page"{% endif %}>{{ crumb.label }}</span>{% endif %}</li>{% endfor %}</ol></nav>{% if app_nav.backs %}<nav class="context-returns" aria-label="Return to section">{% for back in app_nav.backs %}<a href="{{ back.url }}">{{ back.label }}</a>{% endfor %}</nav>{% endif %}</div>{% endif %}
